name: 输入与代码检查 / Input checks
on: [push, pull_request, workflow_dispatch]
jobs:
  input-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: environments/shared-requirements.txt
      - run: pip install -r environments/shared-requirements.txt
      - run: python -m unittest tests.test_input tests.test_knk_results tests.test_oe_results tests.test_sctour_cache -v
      - run: python shared/build_gallery.py
      - run: python -m compileall -q shared modules
# 此CI不下载完整GEO，也不代表三种方法或生物学结果已复现。
